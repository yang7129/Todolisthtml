<!DOCTYPE html>

<html lang="zh-TW" data-theme="light">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Todolisthtml</title>

<style>

:root{

  --bg:#f4f6f8; --panel:#ffffff; --panel2:#fafbfc; --line:#e2e6ea;

  --text:#1f2328; --muted:#6b7280; --faint:#9aa3ad;

  --accent:#2563eb; --accent-soft:#e8f0fe; --accent-text:#fff;

  --ok:#16a34a; --danger:#dc2626; --warn:#d97706;

  --p0:#94a3b8; --p1:#3b82f6; --p2:#f59e0b; --p3:#ef4444;

  --shadow:0 2px 10px rgba(0,0,0,.08); --radius:8px;

}

html[data-theme="dark"]{

  --bg:#14171a; --panel:#1c2024; --panel2:#22272c; --line:#2e343a;

  --text:#e6e9ec; --muted:#9aa3ad; --faint:#6b7280;

  --accent:#4b8bf5; --accent-soft:#22304a; --accent-text:#fff;

  --ok:#3fbf6b; --danger:#f05555; --warn:#e0a030;

  --shadow:0 2px 12px rgba(0,0,0,.4);

}

*{box-sizing:border-box}

html,body{height:100%}

body{margin:0;background:var(--bg);color:var(--text);

  font:14px/1.55 "Segoe UI","Microsoft JhengHei",-apple-system,"Noto Sans TC",sans-serif;

  overflow:hidden}

button,input,select,textarea{font:inherit;color:inherit}

button{cursor:pointer;background:none;border:none}

input,select,textarea{background:var(--panel);border:1px solid var(--line);

  border-radius:6px;padding:6px 9px;outline:none}

input:focus,select:focus,textarea:focus{border-color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;

  padding:6px 11px;white-space:nowrap;transition:.12s}

.btn:hover{border-color:var(--accent);color:var(--accent)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}

.btn.primary:hover{filter:brightness(1.1);color:var(--accent-text)}

.btn.ghost{border-color:transparent}

.btn.ghost:hover{background:var(--panel2)}

.btn:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--muted)}

.icon{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;

  border-radius:6px;font-size:15px}

.icon:hover{background:var(--panel2)}

 

/* ---------- 版面 ---------- */

#app{display:flex;height:100vh}

#side{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);

  display:flex;flex-direction:column;overflow:hidden}

#side .brand{padding:14px 16px 10px;font-weight:700;letter-spacing:.3px;

  display:flex;align-items:baseline;justify-content:space-between}

#side .brand small{font-weight:400;color:var(--faint);font-size:11px}

#navs{flex:1;overflow:auto;padding:0 8px 8px}

.navgroup h4{margin:10px 8px 4px;font-size:11px;color:var(--faint);font-weight:600;

  letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center}

.navgroup h4 button{font-size:14px;color:var(--faint);padding:0 4px;border-radius:4px}

.navgroup h4 button:hover{color:var(--accent);background:var(--panel2)}

.nav{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;

  cursor:pointer;user-select:none;font-size:13px}

.nav:hover{background:var(--panel2)}

.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.nav .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}

.nav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nav .ct{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}

.nav.on .ct{color:var(--accent)}

.nav .edit{opacity:0;font-size:12px;padding:0 3px;color:var(--muted)}

.nav:hover .edit{opacity:.7}

.nav .edit:hover{opacity:1;color:var(--accent)}

.nav.dropon{outline:2px dashed var(--accent);outline-offset:-2px}

.nav.dragging{opacity:.35}

.nav.dropbefore{box-shadow:0 -3px 0 -1px var(--accent)}

.nav.dropafter{box-shadow:0 3px 0 -1px var(--accent)}

#side .foot{padding:10px 8px;border-top:1px solid var(--line);display:flex;gap:5px;align-items:center}

#side .foot .btn{padding:6px 8px;font-size:13px}

#side .foot .icon{width:28px;height:28px;padding:0}

 

#main{flex:1;display:flex;flex-direction:column;min-width:0}

#bar{display:flex;align-items:center;gap:8px;padding:10px 14px;

  border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}

#bar .title{font-size:16px;font-weight:700;margin-right:4px}

.grow{flex:1}

#q{width:170px}

#body{flex:1;overflow:auto;padding:14px 18px 60px}

.wrap{max-width:920px;margin:0 auto}

 

/* ---------- 快速新增 ---------- */

#addbox{display:flex;gap:8px;margin-bottom:6px}

#addinput{flex:1;padding:10px 12px;font-size:14px;background:var(--panel)}

#hint{font-size:11.5px;color:var(--faint);margin:0 0 12px 2px}

#hint code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;

  padding:0 4px;font-family:Consolas,monospace;font-size:11px}

 

/* ---------- 統計 ---------- */

#stats{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--muted)}

#pbar{flex:0 1 260px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}

#pbar i{display:block;height:100%;background:var(--ok);transition:width .25s}

.chip{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11.5px}

.chip.red{color:var(--danger);border-color:var(--danger)}

.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

 

/* ---------- 任務 ---------- */

#list{list-style:none;margin:0;padding:0}

.task{display:flex;gap:10px;align-items:flex-start;background:var(--panel);

  border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius);

  padding:9px 11px;margin-bottom:6px;position:relative}

.task.p0{border-left-color:var(--p0)} .task.p1{border-left-color:var(--p1)}

.task.p2{border-left-color:var(--p2)} .task.p3{border-left-color:var(--p3)}

.task.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

.task.done{opacity:.55}

.task.dragging{opacity:.35}

.task.dropafter{box-shadow:0 3px 0 -1px var(--accent)}

.task.dropbefore{box-shadow:0 -3px 0 -1px var(--accent)}

.grip{cursor:grab;color:var(--faint);font-size:13px;padding-top:2px;user-select:none}

.grip:active{cursor:grabbing}

.cb{width:17px;height:17px;flex:0 0 17px;margin-top:2px;border:1.5px solid var(--faint);

  border-radius:5px;display:inline-flex;align-items:center;justify-content:center;

  font-size:11px;color:transparent;transition:.12s;padding:0}

.cb:hover{border-color:var(--ok)}

.cb.on{background:var(--ok);border-color:var(--ok);color:#fff}

.tmain{flex:1;min-width:0}

.ttitle{word-break:break-word;cursor:text}

.task.done .ttitle{text-decoration:line-through;color:var(--muted)}

.ttitle[contenteditable="true"]{outline:1px solid var(--accent);border-radius:4px;padding:1px 3px}

.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:11.5px}

.tag{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted)}

.due{color:var(--muted)} .due.soon{color:var(--warn);font-weight:600}

.due.over{color:var(--danger);font-weight:700}

.st{border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--muted)}

.st.doing{color:var(--accent);border-color:var(--accent)}

.st.hold{color:var(--warn);border-color:var(--warn)}

.lst,.sub{color:var(--faint)}

.tnote{white-space:pre-wrap;color:var(--muted);font-size:12px;margin-top:4px;

  border-left:2px solid var(--line);padding-left:7px}

.tact{display:flex;gap:2px;opacity:0;transition:.12s}

.task:hover .tact,.task.sel .tact{opacity:1}

.empty{text-align:center;color:var(--faint);padding:50px 0;line-height:2}

.gh{font-size:11.5px;color:var(--faint);font-weight:600;margin:16px 0 6px 2px;

  letter-spacing:.5px;display:flex;align-items:center;gap:8px}

.gh:after{content:"";flex:1;height:1px;background:var(--line)}

 

/* ---------- 明細面板 ---------- */

#detail{width:300px;flex:0 0 300px;background:var(--panel);border-left:1px solid var(--line);

  overflow:auto;padding:14px;display:none}

#detail.on{display:block}

#side.off{display:none}

#dsplit{flex:0 0 6px;cursor:col-resize;background:transparent;display:none;

  transition:background .12s}

#dsplit.on{display:block}

#dsplit:hover,#dsplit.drag{background:var(--accent)}

#btnSide.on{color:var(--accent);background:var(--panel2)}

#detail h3{margin:0 0 12px;font-size:13px;color:var(--faint);letter-spacing:.5px;

  display:flex;justify-content:space-between;align-items:center}

.fld{margin-bottom:11px}

.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}

.fld input,.fld select,.fld textarea{width:100%}

.fld textarea{resize:vertical;min-height:64px;font-size:13px}

#subs{list-style:none;margin:0 0 6px;padding:0}

#subs li{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:13px}

#subs li span{flex:1;cursor:text;word-break:break-word}

#subs li.d span{text-decoration:line-through;color:var(--muted)}

.dmeta{font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:8px;margin-top:12px}

 

/* ---------- 對話框 ---------- */

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;

  align-items:center;justify-content:center;z-index:50;padding:20px}

.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);

  width:100%;max-width:880px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}

.modal.sm{max-width:460px}

.mhead{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;

  display:flex;align-items:center;gap:10px}

.mbody{padding:16px;overflow:auto;flex:1}

.mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;

  align-items:center;flex-wrap:wrap}

.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}

.col{flex:1;min-width:210px}

.col h5{margin:0 0 6px;font-size:11.5px;color:var(--faint);letter-spacing:.5px}

.opt{display:flex;align-items:flex-start;gap:7px;padding:3px 0;font-size:13px;cursor:pointer}

.opt input{width:auto;padding:0;margin-top:3px;flex:0 0 auto}

.opt small{display:block;color:var(--faint);font-size:11px;line-height:1.4}

#preview{background:var(--panel2);border:1px solid var(--line);border-radius:8px;

  padding:12px;height:330px;overflow:auto;white-space:pre-wrap;

  font:12px/1.6 Consolas,"Microsoft JhengHei",monospace}

#preview.rich{white-space:normal;font-family:inherit;font-size:13px;background:#fff;color:#111}

table.keys{width:100%;border-collapse:collapse;font-size:13px}

table.keys td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}

.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;

  padding:0 5px;font:11px/1.7 Consolas,monospace;background:var(--panel2);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;

  background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;

  font-size:13px;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}

.toast.on{opacity:1;bottom:34px}

#drop{position:fixed;inset:0;z-index:80;background:rgba(37,99,235,.14);

  border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;

  font-size:18px;color:var(--accent);font-weight:700}

#drop.on{display:flex}

 

/* ---------- 回收桶／範本／分享 ---------- */

.task.trashed{border-left-color:var(--faint);opacity:.75}

.task.trashed .ttitle{color:var(--muted)}

.task.trashed .tact{opacity:1}

.tpl{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px;cursor:pointer}

.tpl:hover{border-color:var(--accent)}

.tpl.on{border-color:var(--accent);background:var(--accent-soft)}

.tpl b{font-size:13.5px}

.tpl small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}

.tpl .del{float:right;color:var(--faint);font-size:12px;padding:0 4px}

.tpl .del:hover{color:var(--danger)}

.tplpv{font-size:12.5px;color:var(--muted);line-height:2}

.tplpv b{color:var(--text);font-weight:600}

#shareurl{width:100%;font:11.5px/1.6 Consolas,monospace;word-break:break-all}

.warn{color:var(--warn);font-size:12px;margin-top:8px}

 

@media print{

  #side,#bar,#addbox,#hint,#detail,.tact,.grip,.gh:after{display:none!important}

  body,#body{overflow:visible;height:auto}

  .task{break-inside:avoid;border-color:#ccc}

}

@media (max-width:780px){

  #side{display:none}

  #detail{position:fixed;right:0;top:0;bottom:0;z-index:40;box-shadow:var(--shadow)}

}

</style>

</head>

<body>

<div id="app">

 

  <aside id="side">

    <div class="brand"><span>Todolisthtml</span><small>離線單檔</small></div>

    <div id="navs"></div>

    <div class="foot">

      <button class="btn ghost" id="btnImport" title="匯入 JSON">匯入</button>

      <button class="btn ghost" id="btnTpl" title="套用範本">範本</button>

      <button class="btn ghost" id="btnExport" title="匯出／複製">匯出</button>

      <button class="btn ghost icon" id="btnTheme" title="切換深淺主題">◐</button>

      <button class="btn ghost icon" id="btnHelp" title="快捷鍵與說明">?</button>

    </div>

  </aside>

 

  <main id="main">

    <div id="bar">

      <button class="btn ghost icon" id="btnSide" title="隱藏側欄 (Ctrl+B)">☰</button>

      <span class="title" id="viewTitle">全部</span>

      <input id="q" type="search" placeholder="搜尋標題／備註／標籤…">

      <select id="sortSel" title="排序">

        <option value="manual">手動排序</option>

        <option value="due">依到期日</option>

        <option value="priority">依優先級</option>

        <option value="created">依建立時間</option>

        <option value="title">依標題</option>

      </select>

      <select id="stFilter" title="狀態篩選">

        <option value="">全部狀態</option>

        <option value="todo">待辦</option>

        <option value="doing">進行中</option>

        <option value="hold">擱置</option>

        <option value="done">已完成</option>

      </select>

      <label class="opt" style="padding:0"><input type="checkbox" id="showDone"><span>顯示已完成</span></label>

      <span class="grow"></span>

      <button class="btn ghost icon" id="btnUndo" title="復原 Ctrl+Z">↺</button>

      <button class="btn ghost icon" id="btnRedo" title="重做 Ctrl+Y">↻</button>

    </div>

 

    <div id="body">

      <div class="wrap">

        <div id="addbox">

          <input id="addinput" placeholder="輸入待辦後按 Enter…">

          <button class="btn primary" id="btnAdd">新增</button>

        </div>

        <div id="hint">

          快速語法：<code>!</code> 高 <code>!!</code> 緊急 ·

          <code>#標籤</code> · <code>@今天</code> <code>@明天</code> <code>@9/10</code> <code>@2026-09-10</code> ·

          <code>^清單名</code> 指定清單

        </div>

        <div id="tagbar" class="meta" style="margin-bottom:10px"></div>

        <div id="stats"></div>

        <ul id="list"></ul>

      </div>

    </div>

  </main>

 

  <div id="dsplit" title="拖曳調整明細寬度（點兩下還原預設）"></div>

  <aside id="detail"></aside>

</div>

 

<div id="drop">放開以匯入 JSON</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div id="modalHost"></div>

<script>

"use strict";

/* =====================================================================

   Todolisthtml — 離線單檔待辦清單

   資料只存在本機 localStorage，不連外、不上傳。

   ===================================================================== */

 

const KEY   = "todolisthtml.v1";

const BAKKEY= "todolisthtml.backups";

const SCHEMA= 1;

const PRI   = ["低","中","高","緊急"];

const STAT  = { todo:"待辦", doing:"進行中", hold:"擱置", done:"已完成" };

const PALETTE=["#2563eb","#16a34a","#f59e0b","#ef4444","#8b5cf6","#0891b2","#db2777","#65a30d"];

const TRASH_DAYS=7;

const REPEATS=[

  {v:"",   n:"不重複"},

  {v:"d1", n:"每天"},

  {v:"wd", n:"每個工作日"},

  {v:"w1", n:"每週"},

  {v:"w2", n:"每兩週"},

  {v:"m1", n:"每月"}

];

const REPEAT_SYN={ "每天":"d1","daily":"d1","工作日":"wd","weekday":"wd",

  "每週":"w1","每周":"w1","weekly":"w1","每兩週":"w2","每雙週":"w2","每兩周":"w2",

  "每月":"m1","monthly":"m1" };

const repName=v=>{ const r=REPEATS.find(x=>x.v===v); return r?r.n:""; };

 

/* 內建範本：dueIn = 套用當天起算幾天後到期，null = 不設到期日 */

const TEMPLATES=[

{id:"tpl-daily", name:"每日工作", desc:"每天固定要做的幾件事", items:[

   {title:"檢查郵件與訊息", pri:1, tags:["日常"], dueIn:0, repeat:"wd"},

   {title:"今日重點三件事", pri:2, tags:["日常"], dueIn:0, repeat:"wd", subs:["第一件","第二件","第三件"]},

   {title:"更新工作日誌", pri:1, tags:["日常"], dueIn:0, repeat:"wd"}

]},

{id:"tpl-project", name:"專案追蹤", desc:"需求到結案的標準流程", items:[

   {title:"需求確認與範圍界定", pri:2, tags:["專案"], dueIn:3},

   {title:"撰寫規格文件", pri:2, tags:["專案"], dueIn:7},

   {title:"開發", pri:2, tags:["專案"], dueIn:21},

   {title:"單元測試與整合測試", pri:2, tags:["專案"], dueIn:28},

   {title:"上線", pri:3, tags:["專案"], dueIn:30},

   {title:"驗收與結案", pri:1, tags:["專案"], dueIn:35}

]},

{id:"tpl-meeting", name:"會議待辦", desc:"會前、會中、會後", items:[

   {title:"會前：準備議程與資料", pri:2, tags:["會議"], dueIn:0},

   {title:"會中：做會議記錄", pri:1, tags:["會議"], dueIn:0},

   {title:"會後：寄出會議記錄", pri:2, tags:["會議"], dueIn:1},

   {title:"會後：追蹤各項待辦", pri:1, tags:["會議"], dueIn:7}

]},

{id:"tpl-release", name:"上線檢查表", desc:"部署前後該確認的事", items:[

   {title:"備份現行版本與資料庫", pri:3, tags:["上線"], dueIn:0},

   {title:"發出停機／異動公告", pri:2, tags:["上線"], dueIn:0},

   {title:"確認回滾方案", pri:3, tags:["上線"], dueIn:0},

   {title:"部署", pri:3, tags:["上線"], dueIn:0},

   {title:"煙霧測試", pri:3, tags:["上線"], dueIn:0, subs:["主要功能","對外介接","排程作業"]},

   {title:"通知使用者已完成", pri:1, tags:["上線"], dueIn:0}

]},

{id:"tpl-handover", name:"請假交接", desc:"離開前要交代清楚的事", items:[

   {title:"整理待辦與進度給代理人", pri:3, tags:["交接"], dueIn:0},

   {title:"轉交系統權限與帳號", pri:2, tags:["交接"], dueIn:0},

   {title:"設定郵件自動回覆", pri:2, tags:["交接"], dueIn:0},

   {title:"回來後接回進度", pri:1, tags:["交接"], dueIn:7}

]}

];

const allTemplates=()=> TEMPLATES.concat(data.templates||[]);

 

/* ---------- 小工具 ---------- */

const $  = (s,r)=> (r||document).querySelector(s);

const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));

const uid= ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const esc= s=> String(s==null?"":s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const nowISO = ()=> new Date().toISOString();

const clone  = o=> JSON.parse(JSON.stringify(o));

 

function ymd(d){ const p=n=>String(n).padStart(2,"0");

  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

const TODAY = ()=> ymd(new Date());

function addDays(base,n){ const d=new Date(base); d.setDate(d.getDate()+n); return d; }

function dayDiff(a,b){ // a,b = "YYYY-MM-DD"，回傳 a-b 的天數

  const p=s=>{const[y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d);} ;

  return Math.round((p(a)-p(b))/86400000);

}

function weekEnd(){ // 本週日（以週一為首）

  const d=new Date(); const w=(d.getDay()+6)%7; return ymd(addDays(d,6-w));

}

function dueText(due){

  if(!due) return "";

  const diff = dayDiff(due, TODAY());

  if(diff<0)  return "逾期 "+(-diff)+" 天 ("+due.slice(5)+")";

  if(diff===0)return "今天到期";

  if(diff===1)return "明天到期";

  if(diff<=7) return due.slice(5)+"（"+diff+" 天後）";

  return due;

}

function dueClass(due,done){

  if(!due||done) return "";

  const diff=dayDiff(due,TODAY());

  return diff<0 ? "over" : (diff<=2 ? "soon" : "");

}

function toast(msg){

  const t=$("#toast"); t.textContent=msg; t.classList.add("on");

  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("on"),1900);

}

 

/* ---------- 狀態 ---------- */

let data = null;          // 持久化資料

let ui = {                // 不持久化的畫面狀態（部分會寫回 settings）

  view:"all", listId:null, sel:null, q:"", stFilter:"", tagFilter:null

};

let hist=[], redo=[];

 

/* ---------- 版面偏好（側欄收合、明細寬度） ----------

   另存一支 localStorage key，不放進 data.settings。兩個理由：

   settings 會被匯出／匯入，別人的 JSON 匯進來不該改動你的版面；

   而且 save() 會呼叫 AutoBackup.markDirty()，拖個寬度就標記資料變動太吵。 */

const UIKEY = "todolisthtml.ui";

const dnumUI = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };

const DW_MIN = 240, DW_DEF = 300;      // 預設維持原本的 300px，要寬自己拖

function readUI(){ try{ return JSON.parse(localStorage.getItem(UIKEY)||"{}")||{}; }catch(e){ return {}; } }

function saveUI(){

  try{ localStorage.setItem(UIKEY, JSON.stringify({ sideHide: !!ui.sideHide, dw: ui.dw })); }catch(e){}

}

function dwMax(){ return Math.max(DW_MIN, window.innerWidth - 420); }  // 主區至少留 420

function applyDetailWidth(w){

  w = Math.min(Math.max(Math.round(w)||DW_DEF, DW_MIN), dwMax());

  ui.dw = w;

  const d = $("#detail");

  if(d){ d.style.width = w+"px"; d.style.flexBasis = w+"px"; }

  return w;

}

function applySideHide(){

  const s = $("#side"), b = $("#btnSide");

  if(s) s.classList.toggle("off", !!ui.sideHide);

  if(b){

    b.classList.toggle("on", !!ui.sideHide);

    b.title = (ui.sideHide ? "顯示" : "隱藏") + "側欄 (Ctrl+B)";

  }

}

function toggleSide(){ ui.sideHide = !ui.sideHide; applySideHide(); saveUI(); }

function initDetailResize(){

  const sp = $("#dsplit");

  if(!sp) return;

  let sx=0, sw=0, on=false;

  sp.addEventListener("mousedown", e=>{

    on=true; sx=e.clientX; sw=$("#detail").getBoundingClientRect().width;

    sp.classList.add("drag");

    document.body.style.userSelect="none";   // 拖的時候不要選到文字

    e.preventDefault();

  });

  window.addEventListener("mousemove", e=>{ if(on) applyDetailWidth(sw + (sx - e.clientX)); });

  window.addEventListener("mouseup", ()=>{

    if(!on) return;

    on=false; sp.classList.remove("drag");

    document.body.style.userSelect="";

    saveUI();

  });

  sp.addEventListener("dblclick", ()=>{ applyDetailWidth(DW_DEF); saveUI(); });

  window.addEventListener("resize", ()=>applyDetailWidth(ui.dw||DW_DEF));  // 視窗變小要重夾

}

 

function blank(){

  const l1=uid();

  return {

    app:"Todolisthtml", version:SCHEMA, exportedAt:nowISO(),

    settings:{ theme:"light", sort:"manual", showDone:true },

    lists:[{id:l1,name:"我的待辦",color:PALETTE[0]}],

    tasks:[], trash:[], templates:[]

  };

}

function migrate(d){

  if(!d||typeof d!=="object") throw new Error("格式不符");

  if(!Array.isArray(d.tasks)||!Array.isArray(d.lists)) throw new Error("缺少 lists 或 tasks");

  d.version = d.version||1;

  d.settings = Object.assign({theme:"light",sort:"manual",showDone:true}, d.settings||{});

  d.lists.forEach(l=>{ l.id=l.id||uid(); l.name=l.name||"未命名"; l.color=l.color||PALETTE[0]; });

  d.trash = Array.isArray(d.trash) ? d.trash.filter(e=>e&&e.task&&e.task.title!=null).map(e=>({

      id:e.id||uid(), task:e.task, listName:e.listName||"", deletedAt:e.deletedAt||nowISO() })) : [];

  d.templates = Array.isArray(d.templates) ? d.templates.filter(t=>t&&Array.isArray(t.items)).map(t=>({

      id:t.id||uid(), name:t.name||"未命名範本", desc:t.desc||"", custom:true,

      items:t.items.filter(i=>i&&i.title) })) : [];

  d.tasks.forEach((t,i)=>{

    t.id=t.id||uid(); t.title=t.title||"";

    t.status = STAT[t.status]?t.status:"todo";

    t.priority = (typeof t.priority==="number" && t.priority>=0 && t.priority<=3)? t.priority : 1;

    t.tags = Array.isArray(t.tags)?t.tags:[];

    t.subtasks = Array.isArray(t.subtasks)? t.subtasks.map(s=>({id:s.id||uid(),title:s.title||"",done:!!s.done})) : [];

    t.note = t.note||""; t.due = t.due||null;

    t.repeat = REPEATS.some(r=>r.v===t.repeat) ? t.repeat : "";

    t.order = typeof t.order==="number"? t.order : i;

    t.createdAt=t.createdAt||nowISO(); t.updatedAt=t.updatedAt||t.createdAt;

    t.completedAt = t.status==="done" ? (t.completedAt||t.updatedAt) : null;

    if(!d.lists.some(l=>l.id===t.listId)) t.listId = d.lists[0].id;

  });

  return d;

}

 

/* ---------- 存讀檔 ---------- */

let saveTimer=null;

function save(){

  clearTimeout(saveTimer);

  saveTimer=setTimeout(()=>{

    data.exportedAt=nowISO();

    try{ localStorage.setItem(KEY, JSON.stringify(data)); }

    catch(e){ toast("⚠ 本機儲存空間已滿，請先匯出 JSON 備份"); }

    AutoBackup.markDirty();

  },200);

}

function load(){

  try{

    const raw=localStorage.getItem(KEY);

    if(raw) return migrate(JSON.parse(raw));

  }catch(e){ console.warn("載入失敗，改用空白資料",e); }

  return blank();

}

/* 每天第一次開啟時留一份快照，最多 5 份 */

function snapshot(){

  try{

    const baks=JSON.parse(localStorage.getItem(BAKKEY)||"[]");

    const today=TODAY();

    if(baks.some(b=>b.date===today)) return;

    baks.push({date:today, at:nowISO(), json:JSON.stringify(data)});

    while(baks.length>5) baks.shift();

    localStorage.setItem(BAKKEY, JSON.stringify(baks));

  }catch(e){}

}

 

/* ---------- Undo / Redo ---------- */

function push(){

  hist.push(JSON.stringify(data));

  if(hist.length>60) hist.shift();

  redo.length=0;

}

function undo(){ if(!hist.length) return; redo.push(JSON.stringify(data));

  data=migrate(JSON.parse(hist.pop())); save(); render(); toast("已復原"); }

function doRedo(){ if(!redo.length) return; hist.push(JSON.stringify(data));

  data=migrate(JSON.parse(redo.pop())); save(); render(); toast("已重做"); }

 

/* ---------- 快速新增語法 ---------- */

function parseQuick(text){

  const t={ priority:1, tags:[], due:null, listName:null, repeat:"" };

  let s=" "+text+" ";

 

  s=s.replace(/(^|\s)(!{1,3})(?=\s)/g,(m,sp,ex)=>{ t.priority=Math.min(3,1+ex.length); return sp; });

  s=s.replace(/(^|\s)#([^\s#]+)/g,(m,sp,tag)=>{ if(!t.tags.includes(tag)) t.tags.push(tag); return sp; });

  s=s.replace(/(^|\s)\^([^\s^]+)/g,(m,sp,nm)=>{ t.listName=nm; return sp; });

  s=s.replace(/(^|\s)@(\S+)/g,(m,sp,d)=>{ const v=parseDate(d); if(v){ t.due=v; return sp; } return m; });

  s=s.replace(/(^|\s)\*(\S+)/g,(m,sp,r)=>{ const v=REPEAT_SYN[r]; if(v){ t.repeat=v; return sp; } return m; });

 

  t.title=s.trim().replace(/\s{2,}/g," ");

  return t;

}

function parseDate(d){

  const now=new Date();

  const map={ "今天":0,"today":0,"明天":1,"tmr":1,"tomorrow":1,"後天":2,"大後天":3 };

  if(d in map) return ymd(addDays(now,map[d]));

  if(d==="下週"||d==="下周") return ymd(addDays(now,7));

  let m;

  if((m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return ymd(new Date(+m[1],+m[2]-1,+m[3]));

  if((m=d.match(/^(\d{1,2})[/-](\d{1,2})$/))){

    let y=now.getFullYear(); const cand=new Date(y,+m[1]-1,+m[2]);

    if(dayDiff(ymd(cand),TODAY())< -180) cand.setFullYear(y+1);

    return ymd(cand);

  }

  if((m=d.match(/^\+(\d+)$/))) return ymd(addDays(now,+m[1]));

  const wk={"週一":1,"週二":2,"週三":3,"週四":4,"週五":5,"週六":6,"週日":7,

            "周一":1,"周二":2,"周三":3,"周四":4,"周五":5,"周六":6,"周日":7};

  if(d in wk){ const cur=now.getDay()||7; let diff=wk[d]-cur; if(diff<=0) diff+=7;

    return ymd(addDays(now,diff)); }

  return null;

}

 

/* ---------- 資料操作 ---------- */

function curListId(){

  if(ui.view==="list") return ui.listId;

  return data.lists[0] ? data.lists[0].id : null;

}

function addTask(raw){

  const text=raw.trim(); if(!text) return;

  const p=parseQuick(text);

  if(!p.title) { toast("請輸入標題"); return; }

  let listId=curListId();

  if(p.listName){

    let l=data.lists.find(x=>x.name===p.listName||x.name.startsWith(p.listName));

    if(!l){ l={id:uid(),name:p.listName,color:PALETTE[data.lists.length%PALETTE.length]}; data.lists.push(l); }

    listId=l.id;

  }

  push();

  const maxOrder=data.tasks.reduce((a,t)=>Math.max(a,t.order),-1);

  data.tasks.push({

    id:uid(), listId, title:p.title, note:"", status:"todo",

    priority:p.priority, due:p.due, tags:p.tags, subtasks:[], repeat:p.repeat,

    order:maxOrder+1, createdAt:nowISO(), updatedAt:nowISO(), completedAt:null

  });

  save(); render();

}

function getTask(id){ return data.tasks.find(t=>t.id===id); }

function touch(t){ t.updatedAt=nowISO(); }

function setDone(t,done){

  t.status = done?"done":"todo";

  t.completedAt = done? nowISO() : null;

  touch(t);

  if(done && t.repeat) spawnNext(t);

}

/* 重複任務：完成當下就長出下一次，原本那筆留著當紀錄 */

function nextDue(base,rep){

  const [y,m,d]=base.split("-").map(Number);

 

  // 固定天數：直接算，逾期再久也一次到位（不迭代，不會被上限截斷）

  const step={d1:1,w1:7,w2:14}[rep];

  if(step){

    let dt=addDays(new Date(y,m-1,d),step);

    const behind=dayDiff(TODAY(), ymd(dt));       // >=0 表示還沒超過今天

    if(behind>=0) dt=addDays(dt,(Math.floor(behind/step)+1)*step);

    return ymd(dt);

  }

 

  // 工作日：一天一天跳，跳過六日

  if(rep==="wd"){

    let dt=new Date(y,m-1,d), guard=0;

    do{ do{ dt=addDays(dt,1); } while(dt.getDay()===0||dt.getDay()===6); }

    while(dayDiff(ymd(dt),TODAY())<0 && guard++<20000);

    return ymd(dt);

  }

 

  // 每月：錨在原本那一天，短月才夾到月底，不會逐月往前漂

  if(rep==="m1"){

    const anchor=d; let cur=new Date(y,m-1,1), res, guard=0;

    do{

      cur.setMonth(cur.getMonth()+1);

      const last=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();

      res=new Date(cur.getFullYear(),cur.getMonth(),Math.min(anchor,last));

    } while(dayDiff(ymd(res),TODAY())<0 && guard++<600);

    return ymd(res);

  }

  return ymd(addDays(new Date(y,m-1,d),1));

}

function spawnNext(t){

  const next=nextDue(t.due||TODAY(), t.repeat);

  const maxOrder=data.tasks.reduce((a,x)=>Math.max(a,x.order),-1);

  const nt=clone(t);

  nt.id=uid(); nt.status="todo"; nt.completedAt=null; nt.due=next;

  nt.subtasks=nt.subtasks.map(x=>({id:uid(),title:x.title,done:false}));

  nt.order=maxOrder+1; nt.createdAt=nowISO(); nt.updatedAt=nowISO();

  data.tasks.push(nt);

  toast("🔁 已排下一次："+next);

}

function delTask(id){

  const t=getTask(id); if(!t) return;

  push();

  const l=data.lists.find(x=>x.id===t.listId);

  data.trash.push({ id:uid(), task:clone(t), listName:l?l.name:"未分類", deletedAt:nowISO() });

  data.tasks=data.tasks.filter(x=>x.id!==id);

  if(ui.sel===id) ui.sel=null;

  save(); render(); toast("已移到回收桶（Ctrl+Z 或到回收桶還原）");

}

function restoreTrash(tid){

  const e=data.trash.find(x=>x.id===tid); if(!e) return;

  push();

  const t=clone(e.task);

  if(!data.lists.some(l=>l.id===t.listId)){

    const l={id:t.listId||uid(), name:e.listName||"還原的清單",

             color:PALETTE[data.lists.length%PALETTE.length]};

    t.listId=l.id; data.lists.push(l);

  }

  t.order=data.tasks.reduce((a,x)=>Math.max(a,x.order),-1)+1;

  t.updatedAt=nowISO();

  data.tasks.push(t);

  data.trash=data.trash.filter(x=>x.id!==tid);

  save(); render(); toast("已還原到「"+e.listName+"」");

}

function purgeTrash(tid){

  push();

  data.trash=data.trash.filter(x=>x.id!==tid);

  save(); render(); toast("已永久刪除（Ctrl+Z 可復原）");

}

function emptyTrash(){

  if(!data.trash.length) return;

  if(!confirm("確定永久刪除回收桶裡的 "+data.trash.length+" 個項目？")) return;

  push(); data.trash=[]; save(); render(); toast("回收桶已清空（Ctrl+Z 可復原）");

}

/* 超過 TRASH_DAYS 天自動清掉，開檔時跑一次 */

function autoPurge(){

  const before=data.trash.length;

  data.trash=data.trash.filter(e=>dayDiff(TODAY(), e.deletedAt.slice(0,10))<=TRASH_DAYS);

  if(data.trash.length!==before) save();

}

 

/* =====================================================================

   篩選與排序

   ===================================================================== */

const VIEWS = [

  { id:"all",     name:"全部",   icon:"▤" },

  { id:"today",   name:"今天",   icon:"◉" },

  { id:"week",    name:"本週",   icon:"▦" },

  { id:"overdue", name:"逾期",   icon:"⚑" },

  { id:"done",    name:"已完成", icon:"✓" },

  { id:"trash",   name:"回收桶", icon:"🗑" }

];

function inView(t,view){

  switch(view){

    case "all":     return true;

    case "today":   return t.status!=="done" && t.due && dayDiff(t.due,TODAY())<=0;

    case "week":    return t.status!=="done" && t.due && t.due<=weekEnd();

    case "overdue": return t.status!=="done" && t.due && dayDiff(t.due,TODAY())<0;

    case "done":    return t.status==="done";

    case "trash":   return false;

    default:        return true;

  }

}

function viewTasks(){

  if(ui.view==="trash") return [];

  const q=ui.q.trim().toLowerCase();

  let arr=data.tasks.filter(t=>{

    if(ui.view==="list"){ if(t.listId!==ui.listId) return false; }

    else if(!inView(t,ui.view)) return false;

    if(ui.view!=="done" && !data.settings.showDone && t.status==="done") return false;

    if(ui.stFilter && t.status!==ui.stFilter) return false;

    if(ui.tagFilter && !t.tags.includes(ui.tagFilter)) return false;

    if(q){

      const hay=(t.title+" "+t.note+" "+t.tags.join(" ")+" "+

                 t.subtasks.map(s=>s.title).join(" ")).toLowerCase();

      if(!hay.includes(q)) return false;

    }

    return true;

  });

  return sortTasks(arr, data.settings.sort);

}

function sortTasks(arr,mode){

  const far="9999-12-31";

  const cmp={

    manual:  (a,b)=> a.order-b.order,

    due:     (a,b)=> (a.due||far).localeCompare(b.due||far) || b.priority-a.priority,

    priority:(a,b)=> b.priority-a.priority || (a.due||far).localeCompare(b.due||far),

    created: (a,b)=> a.createdAt.localeCompare(b.createdAt),

    title:   (a,b)=> a.title.localeCompare(b.title,"zh-Hant")

  }[mode] || ((a,b)=>a.order-b.order);

  // 已完成一律沉底（「已完成」檢視除外）

  return arr.sort((a,b)=>{

    if(ui.view!=="done"){

      const ad=a.status==="done"?1:0, bd=b.status==="done"?1:0;

      if(ad!==bd) return ad-bd;

    }

    return cmp(a,b);

  });

}

   繪製

function render(){

  document.documentElement.setAttribute("data-theme", data.settings.theme);

  renderSide(); renderBar(); renderTagbar(); renderList(); renderDetail(); refreshUndo();

}

function refreshUndo(){

  $("#btnUndo").disabled=!hist.length; $("#btnRedo").disabled=!redo.length;

}

 

function renderSide(){

  const cnt=v=>data.tasks.filter(t=>inView(t,v)&&(v==="done"||t.status!=="done")).length;

  let h='<div class="navgroup"><h4>檢視</h4>';

  VIEWS.forEach(v=>{

    const n= v.id==="trash" ? data.trash.length

           : v.id==="done"  ? data.tasks.filter(t=>t.status==="done").length : cnt(v.id);

    const cls = v.id==="overdue" && n>0 ? ' style="color:var(--danger)"' : "";

    h+= '<div class="nav'+(ui.view===v.id?" on":"")+'" data-view="'+v.id+'">'+

        '<span'+cls+'>'+v.icon+'</span><span class="nm">'+v.name+'</span>'+

        '<span class="ct">'+(n||"")+'</span></div>';

  });

  h+='</div><div class="navgroup"><h4>清單<button id="btnNewList" title="新增清單">＋</button></h4>';

  data.lists.forEach(l=>{

    const n=data.tasks.filter(t=>t.listId===l.id&&t.status!=="done").length;

    h+= '<div class="nav'+(ui.view==="list"&&ui.listId===l.id?" on":"")+'" data-list="'+l.id+'" draggable="true">'+

        '<span class="dot" style="background:'+esc(l.color)+'"></span>'+

        '<span class="nm">'+esc(l.name)+'</span>'+

        '<span class="ct">'+(n||"")+'</span>'+

        '<button class="edit" data-editlist="'+l.id+'" title="設定清單">⋯</button></div>';

  });

  h+='</div>';

  $("#navs").innerHTML=h;

}

 

function renderBar(){

  let title="全部";

  if(ui.view==="list"){ const l=data.lists.find(x=>x.id===ui.listId); title=l?l.name:"清單"; }

  else { const v=VIEWS.find(v=>v.id===ui.view); title=v?v.name:"全部"; }

  $("#viewTitle").textContent=title;

  $("#sortSel").value=data.settings.sort;

  $("#stFilter").value=ui.stFilter;

  $("#showDone").checked=data.settings.showDone;

  $("#q").value=ui.q;

  const hide = ui.view==="trash" ? "none" : "";

  $("#addbox").style.display=hide;

  $("#hint").style.display=hide;

  $("#tagbar").style.display=hide;

}

 

function renderTagbar(){

  const pool={};

  data.tasks.forEach(t=>{ if(ui.view==="list"&&t.listId!==ui.listId) return;

    t.tags.forEach(g=>pool[g]=(pool[g]||0)+1); });

  const keys=Object.keys(pool).sort((a,b)=>pool[b]-pool[a]).slice(0,20);

  $("#tagbar").innerHTML = keys.length

    ? keys.map(k=>'<button class="chip'+(ui.tagFilter===k?" on":"")+'" data-tag="'+esc(k)+'">#'+esc(k)+' '+pool[k]+'</button>').join("")

    : "";

}

 

function renderTrash(){

  const arr=data.trash.slice().reverse();

  $("#stats").innerHTML = arr.length

    ? '<span>'+arr.length+' 個已刪除項目</span>'+

      '<span class="chip">超過 '+TRASH_DAYS+' 天自動清除</span><span class="grow"></span>'+

      '<button class="btn" id="btnEmptyTrash">清空回收桶</button>'

    : "";

  if(!arr.length){

    $("#list").innerHTML='<div class="empty">回收桶是空的<br><small>刪除的項目會先放這裡 '+TRASH_DAYS+' 天</small></div>';

    return;

  }

  $("#list").innerHTML=arr.map(e=>{

    const left=TRASH_DAYS-dayDiff(TODAY(), e.deletedAt.slice(0,10));

    return '<li class="task trashed" data-tid="'+e.id+'">'+

      '<span class="grip" style="visibility:hidden">⋮⋮</span>'+

      '<div class="tmain"><div class="ttitle">'+esc(e.task.title)+'</div>'+

      '<div class="meta"><span class="lst">▸ '+esc(e.listName)+'</span>'+

        '<span class="due'+(left<=2?" over":"")+'">'+esc(e.deletedAt.slice(0,10))+' 刪除・'+

        (left<=0?"今天清除":left+" 天後清除")+'</span></div></div>'+

      '<div class="tact">'+

        '<button class="btn ghost icon" data-tact="restore" title="還原">↩</button>'+

function renderList(){

  if(ui.view==="trash"){ renderTrash(); return; }

  const arr=viewTasks();

  const total=arr.length, done=arr.filter(t=>t.status==="done").length;

  const over=arr.filter(t=>t.status!=="done"&&t.due&&dayDiff(t.due,TODAY())<0).length;

  const pct= total? Math.round(done/total*100):0;

  $("#stats").innerHTML= total

    ? '<span>完成 '+done+' / '+total+'</span><div id="pbar"><i style="width:'+pct+'%"></i></div>'+

      '<span>'+pct+'%</span>'+ (over?'<span class="chip red">逾期 '+over+'</span>':'')

    : "";

 

  if(!total){

    $("#list").innerHTML='<div class="empty">沒有符合的項目<br><small>在上面輸入一行就能新增</small></div>';

    return;

  }

  const groupByList = (ui.view!=="list");

  let html="", lastList=null;

  arr.forEach(t=>{

    if(groupByList && data.settings.sort==="manual"){

      if(t.listId!==lastList){

        lastList=t.listId;

        const l=data.lists.find(x=>x.id===t.listId);

        html+='<div class="gh">'+esc(l?l.name:"未分類")+'</div>';

      }

    }

    html+=taskHtml(t, !groupByList);

  });

  $("#list").innerHTML=html;

}

 

function taskHtml(t,hideList){

  const l=data.lists.find(x=>x.id===t.listId);

  const done=t.status==="done";

  const subDone=t.subtasks.filter(s=>s.done).length;

  let meta="";

  if(t.due) meta+='<span class="due '+dueClass(t.due,done)+'">⏰ '+esc(dueText(t.due))+'</span>';

  if(t.status!=="todo"&&t.status!=="done") meta+='<span class="st '+t.status+'">'+STAT[t.status]+'</span>';

  if(t.priority>=2) meta+='<span class="st" style="color:var(--p'+t.priority+');border-color:var(--p'+t.priority+')">⚑'+PRI[t.priority]+'</span>';

  t.tags.forEach(g=>meta+='<span class="tag">#'+esc(g)+'</span>');

  if(t.repeat) meta+='<span class="st" title="重複任務">🔁 '+repName(t.repeat)+'</span>';

  if(t.subtasks.length) meta+='<span class="sub">☑ '+subDone+'/'+t.subtasks.length+'</span>';

  if(!hideList&&l) meta+='<span class="lst">▸ '+esc(l.name)+'</span>';

 

  return '<li class="task p'+t.priority+(done?" done":"")+(ui.sel===t.id?" sel":"")+

    '" data-id="'+t.id+'" draggable="true">'+

    '<span class="grip" title="拖曳排序">⋮⋮</span>'+

    '<button class="cb'+(done?" on":"")+'" data-act="toggle" title="完成／取消">✔</button>'+

    '<div class="tmain">'+

      (meta?'<div class="meta">'+meta+'</div>':"")+

      (t.note?'<div class="tnote">'+esc(t.note)+'</div>':"")+

    '</div>'+

    '<div class="tact">'+

      '<button class="btn ghost icon" data-act="detail" title="明細">✎</button>'+

      '<button class="btn ghost icon" data-act="del" title="刪除">🗑</button>'+

    '</div></li>';

}

function inlineEdit(el,t){

  if(el.isContentEditable) return;

  el.contentEditable="true"; el.focus();

  const r=document.createRange(); r.selectNodeContents(el);

  const s=getSelection(); s.removeAllRanges(); s.addRange(r);

  const finish=(ok)=>{

    el.contentEditable="false";

    const v=el.textContent.trim();

    if(ok && v && v!==t.title){ push(); t.title=v; touch(t); save(); }

    render();

  };

  el.addEventListener("blur",()=>finish(true),{once:true});

  el.addEventListener("keydown",ev=>{

   if(ev.key==="Enter"){ ev.preventDefault(); el.blur(); }

    if(ev.key==="Escape"){ ev.preventDefault(); el.textContent=t.title; el.blur(); }

  });

}

let dragId=null;

$("#list").addEventListener("dragstart", e=>{

  dragId=li.dataset.id; li.classList.add("dragging");

  e.dataTransfer.effectAllowed="move";

  e.dataTransfer.setData("text/plain", dragId);

});

$("#list").addEventListener("dragend", ()=>{

  dragId=null; $$(".task").forEach(x=>x.classList.remove("dragging","dropbefore","dropafter"));

  $$(".nav").forEach(x=>x.classList.remove("dropon"));

});

$("#list").addEventListener("dragover", e=>{

  if(!dragId) return; e.preventDefault();

  const li=e.target.closest(".task"); if(!li||li.dataset.id===dragId) return;

  const before = (e.clientY - li.getBoundingClientRect().top) < li.offsetHeight/2;

  $$(".task").forEach(x=>x.classList.remove("dropbefore","dropafter"));

  li.classList.add(before?"dropbefore":"dropafter");

});

$("#list").addEventListener("drop", e=>{

  if(!dragId) return; e.preventDefault();

  const li=e.target.closest(".task"); if(!li||li.dataset.id===dragId) return;

  const before=li.classList.contains("dropbefore");

  reorder(dragId, li.dataset.id, before);

});

function reorder(srcId,dstId,before){

  if(data.settings.sort!=="manual"){ toast("請先切換為「手動排序」才能拖曳"); return; }

  push();

  const arr=data.tasks.slice().sort((a,b)=>a.order-b.order);

  const src=arr.find(t=>t.id===srcId), dst=arr.find(t=>t.id===dstId);

  arr.splice(arr.indexOf(src),1);

  arr.splice(arr.indexOf(dst)+(before?0:1),0,src);

  arr.forEach((t,i)=>t.order=i);

  if(src.listId!==dst.listId){ src.listId=dst.listId; }

  touch(src); save(); render();

}

/* 側欄清單本身也可以上下拖曳調整順序。

   用獨立的 dragListId，不跟任務的 dragId 混用——側欄同時是

   「拖任務進來＝搬移」的放置目標，兩種拖曳必須分得開。

   清單沒有 order 欄位，順序就是 data.lists 的陣列順序，所以直接搬陣列元素。 */

let dragListId=null;

$("#navs").addEventListener("dragstart", e=>{

  const n=e.target.closest("[data-list]"); if(!n) return;

  dragListId=n.dataset.list; n.classList.add("dragging");

  e.dataTransfer.effectAllowed="move";

  try{ e.dataTransfer.setData("text/plain", dragListId); }catch(x){}

});

$("#navs").addEventListener("dragend", ()=>{

  dragListId=null;

  $$(".nav").forEach(x=>x.classList.remove("dragging","dropbefore","dropafter","dropon"));

});

 

/* 拖到側欄清單 = 搬移（任務）／調整順序（清單） */

$("#navs").addEventListener("dragover", e=>{

  const n=e.target.closest("[data-list]"); if(!n) return;

  if(dragListId){

    if(n.dataset.list===dragListId) return;

    e.preventDefault();

    const before=(e.clientY-n.getBoundingClientRect().top) < n.offsetHeight/2;

    $$(".nav").forEach(x=>x.classList.remove("dropbefore","dropafter"));

    n.classList.add(before?"dropbefore":"dropafter");

    return;

  }

  if(!dragId) return;

  e.preventDefault(); $$(".nav").forEach(x=>x.classList.remove("dropon")); n.classList.add("dropon");

});

$("#navs").addEventListener("dragleave", e=>{

  const n=e.target.closest("[data-list]"); if(n) n.classList.remove("dropbefore","dropafter","dropon");

});

$("#navs").addEventListener("drop", e=>{

  const n=e.target.closest("[data-list]"); if(!n) return;

  if(dragListId){

    if(n.dataset.list===dragListId) return;

    e.preventDefault();

    const before=n.classList.contains("dropbefore");

    const src=dragListId; dragListId=null;

    reorderList(src, n.dataset.list, before);

    return;

  }

  if(!dragId) return;

  e.preventDefault(); const t=getTask(dragId); if(!t) return;

  push(); t.listId=n.dataset.list; touch(t); save(); render(); toast("已搬移");

});

 

/* 清單重新排序：直接搬 data.lists 的陣列元素。

   splice 之後索引會變，所以要重新找一次目標位置。 */

function reorderList(srcId, dstId, before){

  const arr=data.lists;

  const si=arr.findIndex(l=>l.id===srcId);

  if(si<0 || srcId===dstId) return;

  if(arr.findIndex(l=>l.id===dstId)<0) return;

  push();

  const src=arr.splice(si,1)[0];

  const at=arr.findIndex(l=>l.id===dstId)+(before?0:1);

  arr.splice(at,0,src);

  save(); render(); toast("清單順序已調整");

}

function tplItemLine(it){

  const bits=[];

  if(typeof it.pri==="number" && it.pri>=2) bits.push("⚑"+PRI[it.pri]);

  if(typeof it.dueIn==="number") bits.push("⏰"+(it.dueIn===0?"當天":"＋"+it.dueIn+" 天"));

  if(it.repeat) bits.push("🔁"+repName(it.repeat));

  if(it.tags&&it.tags.length) bits.push(it.tags.map(x=>"#"+x).join(" "));

  return "<b>"+esc(it.title)+"</b>"+(bits.length?" — "+esc(bits.join(" ・ ")):"")+

    ((it.subs&&it.subs.length)?'<br><span style="padding-left:14px">└ '+

      it.subs.map(esc).join("　└ ")+"</span>":"");

}

function templateDialog(){

  let sel=allTemplates()[0];

  const body=

   '<div class="row">'+

    '<div class="col" style="max-width:280px"><h5>選一個範本</h5><div id="tplList"></div></div>'+

    '<div class="col"><h5 id="tplName">預覽</h5><div class="tplpv" id="tplPv"></div>'+

      '<h5 style="margin-top:14px">套用到</h5>'+

      '<label class="opt"><input type="radio" name="tmode" value="new" checked><span>建立成新清單</span></label>'+

      '<input id="tplNewName" placeholder="新清單名稱" style="margin:2px 0 8px 22px;width:calc(100% - 22px)">'+

      '<label class="opt"><input type="radio" name="tmode" value="cur"><span>加到目前清單'+

        '<small>'+esc(scopeTitle("list"))+'</small></span></label>'+

    '</div></div>';

  const m=modal("範本", body, [

    {txt:"把目前畫面存成範本", cls:"btn", keep:true, act:saveAsTemplate},

    {grow:true},

    {txt:"取消", cls:"btn"},

    {txt:"套用", cls:"btn primary", act:()=>{

      if(!sel) return false;

      const mode=$('input[name="tmode"]:checked',m).value;

      applyTemplate(sel, mode, $("#tplNewName",m).value.trim());

    }}

  ]);

  function paintList(){

    $("#tplList",m).innerHTML=allTemplates().map(t=>

      '<div class="tpl'+(sel&&sel.id===t.id?" on":"")+'" data-tpl="'+t.id+'">'+

        (t.custom?'<button class="del" data-deltpl="'+t.id+'" title="刪除這個自訂範本">✕</button>':"")+

        '<b>'+esc(t.name)+'</b>'+(t.custom?' <span class="chip" style="font-size:10px">自訂</span>':"")+

        '<small>'+esc(t.desc||(t.items.length+" 個項目"))+'</small></div>').join("");

  }

  function paintPv(){

    if(!sel){ $("#tplPv",m).innerHTML="（沒有範本）"; return; }

    $("#tplName",m).textContent="預覽 — "+sel.name+"（"+sel.items.length+" 項）";

    $("#tplPv",m).innerHTML=sel.items.map(tplItemLine).join("<br>");

    const inp=$("#tplNewName",m); if(!inp.value) inp.placeholder=sel.name;

  }

  $("#tplList",m).addEventListener("click", ev=>{

    const d=ev.target.closest("[data-deltpl]");

    if(d){

      ev.stopPropagation();

      const t=data.templates.find(x=>x.id===d.dataset.deltpl);

      if(!t || !confirm("刪除自訂範本「"+t.name+"」？")) return;

      push(); data.templates=data.templates.filter(x=>x.id!==t.id); save();

      if(sel && sel.id===t.id) sel=allTemplates()[0];

      paintList(); paintPv(); return;

    }

    const c=ev.target.closest("[data-tpl]"); if(!c) return;

    sel=allTemplates().find(x=>x.id===c.dataset.tpl);

    paintList(); paintPv();

  });

  paintList(); paintPv();

  function saveAsTemplate(){

    const items=viewTasks().filter(t=>t.status!=="done").map(t=>({

      title:t.title, pri:t.priority, tags:t.tags.slice(), note:t.note,

      dueIn: t.due? dayDiff(t.due,TODAY()) : null,

      repeat:t.repeat, subs:t.subtasks.map(x=>x.title)

    }));

    if(!items.length){ toast("目前畫面沒有未完成項目可存"); return; }

    const nm=prompt("範本名稱", scopeTitle(ui.view==="list"?"list":"view"));

    if(nm==null||!nm.trim()) return;

    push();

    const t={ id:uid(), name:nm.trim(), desc:items.length+" 個項目（自訂）", custom:true, items };

    data.templates.push(t); save();

    sel=t; paintList(); paintPv();

    toast("已存成範本「"+t.name+"」");

  }

}

function applyTemplate(tpl, mode, newName){

  push();

  let listId;

  if(mode==="new"){

    const l={ id:uid(), name:(newName||tpl.name), color:PALETTE[data.lists.length%PALETTE.length] };

    data.lists.push(l); listId=l.id; ui.view="list"; ui.listId=l.id;

  } else listId=curListId();

  let ord=data.tasks.reduce((a,t)=>Math.max(a,t.order),-1);

  tpl.items.forEach(it=>{

    data.tasks.push({

      id:uid(), listId, title:it.title, note:it.note||"", status:"todo",

      priority: typeof it.pri==="number"? it.pri : 1,

      due: typeof it.dueIn==="number" ? ymd(addDays(new Date(), it.dueIn)) : null,

      tags:(it.tags||[]).slice(), repeat: it.repeat||"",

      subtasks:(it.subs||[]).map(x=>({id:uid(),title:x,done:false})),

      order:++ord, createdAt:nowISO(), updatedAt:nowISO(), completedAt:null

    });

  });

  ui.sel=null; save(); render();

  toast("已套用範本「"+tpl.name+"」，新增 "+tpl.items.length+" 項");

}

 

/* Ctrl+S：立即備份到已設定的資料夾。

   資料本身每次變動就寫 localStorage 了，不需要手動存；這裡「存檔」的意思是

   把一份寫到你選的資料夾（平常 24 小時才自動跑一次）。

   沒設定過資料夾的話 run() 會直接回 false 什麼都不做，按了沒反應會以為壞掉，

   所以先擋下來把設定叫出來。 */

function backupNow(){

  if(AutoBackup.mode === "unset" || AutoBackup.mode === "off"){

    toast("尚未設定自動備份，先選一個資料夾");

    AutoBackup.settings();

    return;

  }

  AutoBackup.now().then(ok => toast(ok ? "已備份到資料夾" : "備份未完成 — 看一下畫面上方的提示列"));

}

 

/* --- 快捷鍵 --- */

document.addEventListener("keydown", e=>{

  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !e.shiftKey){ if(!inField){ e.preventDefault(); undo(); } return; }

  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==="y" || (e.shiftKey&&e.key.toLowerCase()==="z"))){ if(!inField){ e.preventDefault(); doRedo(); } return; }

  if((e.ctrlKey||e.metaKey) && e.altKey && e.key.toLowerCase()==="s"){ e.preventDefault(); download(jsonBlobName(), JSON.stringify(exportData(scopeAll(),true),null,2)); return; }

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); backupNow(); return; }

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="e"){ e.preventDefault(); exportDialog(); return; }

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="b"){ e.preventDefault(); toggleSide(); return; }

  if(inField) return;

  if(e.key==="/"){ e.preventDefault(); $("#q").focus(); }

  else if(e.key==="n"){ e.preventDefault(); $("#addinput").focus(); }

  else if(e.key==="?"){ e.preventDefault(); helpDialog(); }

  else if(e.key==="Escape"){ if(ui.sel){ ui.sel=null; render(); } }

  else if(e.key==="Delete" && ui.sel){ delTask(ui.sel); }

});

function modal(title, bodyHtml, buttons, size){

  const host=$("#modalHost");

  const mask=document.createElement("div");

  mask.className="mask";

  mask.innerHTML='<div class="modal '+(size||"")+'">'+

    '<div class="mhead"><span class="grow">'+esc(title)+'</span>'+

      '<button class="btn ghost icon" data-close>✕</button></div>'+

    '<div class="mbody">'+bodyHtml+'</div>'+

    '<div class="mfoot"></div></div>';

  const foot=$(".mfoot",mask);

  (buttons||[]).filter(Boolean).forEach(b=>{

    if(b.grow){ const s=document.createElement("span"); s.className="grow"; foot.appendChild(s); return; }

    const btn=document.createElement("button");

    btn.className=b.cls||"btn"; btn.textContent=b.txt; btn.id=b.id||"";

    btn.addEventListener("click",()=>{ if(b.act && b.act()===false) return; if(!b.keep) close(); });

    foot.appendChild(btn);

  });

  function close(){ mask.remove(); document.removeEventListener("keydown",onEsc); }

  function onEsc(e){ if(e.key==="Escape"){ e.stopPropagation(); close(); } }

  mask.addEventListener("click",e=>{ if(e.target===mask||e.target.closest("[data-close]")) close(); });

  document.addEventListener("keydown",onEsc);

  host.appendChild(mask);

  mask.close=close;

  return mask;

}

function scopeAll(){ return data.tasks.slice(); }

function collect(scope, undoneOnly){

  let arr;

  if(scope==="list")      arr=data.tasks.filter(t=>t.listId===curListId());

  else if(scope==="view") arr=viewTasks();

  else                    arr=data.tasks.slice();

  if(undoneOnly) arr=arr.filter(t=>t.status!=="done");

  return sortTasks(arr, data.settings.sort==="manual"?"manual":data.settings.sort);

}

function groupByList(arr){

  const g=[];

  data.lists.forEach(l=>{

    const items=arr.filter(t=>t.listId===l.id);

    if(items.length) g.push({list:l, items});

  });

  const orphan=arr.filter(t=>!data.lists.some(l=>l.id===t.listId));

  if(orphan.length) g.push({list:{name:"未分類",color:"#888"}, items:orphan});

  return g;

}

function scopeTitle(scope){

  if(scope==="list"){ const l=data.lists.find(x=>x.id===curListId()); return l?l.name:"待辦"; }

  if(scope==="view") return $("#viewTitle").textContent;

  return "全部待辦";

}

function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0");

  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); }

/* =====================================================================

   匯出格式 1：純文字

   ===================================================================== */

function buildText(o){

  const g=groupByList(o.tasks);

  const done=o.tasks.filter(t=>t.status==="done").length;

  let s = "■ "+o.title+"（"+TODAY()+"）  完成 "+done+"/"+o.tasks.length+"\n";

  s += "".padEnd(40,"-")+"\n";

  g.forEach(grp=>{

    if(g.length>1) s += "\n【"+grp.list.name+"】\n";

    grp.items.forEach(t=>{

      s += (t.status==="done"?"[x] ":"[ ] ")+t.title;

      const tail=[];

      if(o.priority && t.priority>=2) tail.push("⚑"+PRI[t.priority]);

      if(o.due && t.due) tail.push("⏰"+dueText(t.due));

      if(t.status==="doing"||t.status==="hold") tail.push(STAT[t.status]);

      if(o.tags && t.tags.length) tail.push(t.tags.map(x=>"#"+x).join(" "));

      if(tail.length) s += "   "+tail.join("  ");

      s += "\n";

      if(o.subtasks) t.subtasks.forEach(x=>s += "    └ "+(x.done?"[x] ":"[ ] ")+x.title+"\n");

      if(o.note && t.note) t.note.split("\n").forEach(n=>s += "      "+n+"\n");

    });

  });

  return s;

}

 

/* =====================================================================

   匯出格式 2：Markdown

   ===================================================================== */

function buildMarkdown(o){

  const g=groupByList(o.tasks);

  const done=o.tasks.filter(t=>t.status==="done").length;

  let s = "# "+o.title+"\n\n> "+TODAY()+" ・ 完成 "+done+"/"+o.tasks.length+"\n\n";

  g.forEach(grp=>{

    if(g.length>1) s += "## "+grp.list.name+"\n\n";

    grp.items.forEach(t=>{

      let line = "- ["+(t.status==="done"?"x":" ")+"] "+t.title;

      const tail=[];

      if(o.priority && t.priority>=2) tail.push("**"+PRI[t.priority]+"**");

      if(o.due && t.due) tail.push("`"+dueText(t.due)+"`");

      if(t.status==="doing"||t.status==="hold") tail.push("_"+STAT[t.status]+"_");

      if(o.tags && t.tags.length) tail.push(t.tags.map(x=>"`#"+x+"`").join(" "));

      if(tail.length) line += " — "+tail.join(" ・ ");

      s += line+"\n";

      if(o.subtasks) t.subtasks.forEach(x=>s += "  - ["+(x.done?"x":" ")+"] "+x.title+"\n");

      if(o.note && t.note) s += "  > "+t.note.replace(/\n/g,"\n  > ")+"\n";

    });

    s += "\n";

  });

  return s;

}

/* =====================================================================

   匯出格式 7：分享連結

   把資料壓進網址的 # 後面。有 CompressionStream 就 deflate，沒有就純 base64。

   ===================================================================== */

async function encodeShare(obj){

  const bytes=new TextEncoder().encode(JSON.stringify(obj));

  let out=bytes, flag="r";

  if(window.CompressionStream){

    try{

      const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));

      out=new Uint8Array(await new Response(st).arrayBuffer()); flag="z";

    }catch(e){}

  }

  let bin=""; for(let i=0;i<out.length;i++) bin+=String.fromCharCode(out[i]);

  return flag+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

}

async function decodeShare(code){

  const flag=code[0];

  let b64=code.slice(1).replace(/-/g,"+").replace(/_/g,"/");

  while(b64.length%4) b64+="=";

  const bin=atob(b64);

  let bytes=new Uint8Array(bin.length);

  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);

  if(flag==="z"){

    const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));

    bytes=new Uint8Array(await new Response(st).arrayBuffer());

  }

  return JSON.parse(new TextDecoder().decode(bytes));

}

async function buildShareUrl(tasks){

  const code=await encodeShare(exportData(tasks,false));

  return location.href.split("#")[0]+"#s="+code;

}

/* 開檔時看網址有沒有帶資料 */

    catch(e){ location.hash=""; }

    importDialog(inc,"分享連結");

}

                 due:expOpt.due, priority:expOpt.priority, tags:expOpt.tags,

                 subtasks:expOpt.subtasks, note:expOpt.note }, tasks };

    const {o,tasks}=payload();

      case "text":  return {text:buildText(o)};

      case "md":    return {text:buildMarkdown(o)};

      case "mailP": return {text:buildText(o), html:buildMailHtml(o,"plain")};

      case "mailC": return {text:buildText(o), html:buildMailHtml(o,"color")};

      case "csv":   return {text:buildCsv(o)};

      case "json":  return {text:JSON.stringify(exportData(tasks, expOpt.scope==="all"&&!expOpt.undone),null,2)};

      case "viewer":return {text:buildViewer(o), viewer:true};

      case "share": {

        const url=await buildShareUrl(tasks);

        return {text:url, share:true, tooLong:url.length>8000};

  let seq=0;

    const my=++seq;

    if(expOpt.fmt==="share"){ pv.classList.remove("rich"); pv.textContent="產生中…"; }

    const r=await build();

    if(r.html){ pv.classList.add("rich"); pv.innerHTML=r.html; }

    else if(r.share){

        "・連結本身就是資料，不會上傳到任何伺服器\n"+

        (r.tooLong? "\n⚠ 這個連結太長了，很多聊天軟體與信箱會截斷。建議改用 JSON 或獨立 HTML 檢視器。":"");

    }

    else { pv.classList.remove("rich"); pv.textContent=r.text; }

  }

  async function doCopy(){

    const r=await build();

    if(r.html) copyRich(r.html, r.text);

    else copyText(r.text);

  }

  async function doDownload(){

    const r=await build(); const f=FORMATS[expOpt.fmt];

    const base = expOpt.fmt==="json" ? "Todolisthtml" : scopeTitle(expOpt.scope).replace(/[\\/:*?"<>|]/g,"_");

    let content=r.text;

    if(r.html) content='<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><title>'+

      esc(scopeTitle(expOpt.scope))+'</title></head><body style="margin:16px">'+r.html+'</body></html>';

    download(base+"-"+stamp()+"."+f.ext, content, f.mime);

  }

  m.addEventListener("change", refresh);

  refresh();

}

 

/* ---------- 剪貼簿與下載 ---------- */

function copyText(text){

  const done=()=>toast("已複製純文字");

  if(navigator.clipboard && navigator.clipboard.writeText)

    navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,null,done));

  else fallbackCopy(text,null,done);

}

function copyRich(html,text){

  const done=()=>toast("已複製（貼到信件會保留格式）");

  if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){

    const item=new ClipboardItem({

      "text/html": new Blob([html],{type:"text/html"}),

      "text/plain":new Blob([text],{type:"text/plain"})

    });

    navigator.clipboard.write([item]).then(done, ()=>fallbackCopy(text,html,done));

  } else fallbackCopy(text,html,done);

}

function fallbackCopy(text,html,done){

  const box=document.createElement("div");

  box.contentEditable="true";

  box.style.cssText="position:fixed;left:-9999px;top:0;white-space:pre-wrap";

  if(html) box.innerHTML=html; else box.textContent=text;

  document.body.appendChild(box);

  const r=document.createRange(); r.selectNodeContents(box);

  const s=getSelection(); s.removeAllRanges(); s.addRange(r);

  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}

  s.removeAllRanges(); box.remove();

  ok? done() : toast("⚠ 瀏覽器擋住剪貼簿，請改用「下載檔案」");

}

function download(name, content, mime){

  try{

    const blob=new Blob([content],{type:(mime||"text/plain")+";charset=utf-8"});

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob); a.download=name;

    document.body.appendChild(a); a.click();

    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);

    toast("已下載 "+name);

  }catch(e){ toast("⚠ 下載失敗："+e.message); }

}

function readFile(file){

  const r=new FileReader();

  r.onload=()=>{

    let inc;

    try{ inc=migrate(JSON.parse(r.result)); }

    catch(err){ toast("⚠ 不是有效的 Todolisthtml JSON："+err.message); return; }

    importDialog(inc, file.name);

  };

  r.readAsText(file,"utf-8");

}

      '<small>相同 id 的項目以較新的更新時間為準，其餘新增</small></span></label>'+

function doImport(inc, mode){

  push();

  if(mode==="replace"){

    data=inc; ui.view="all"; ui.listId=null; ui.sel=null;

  } else if(mode==="new"){

    const map={};

    inc.lists.forEach(l=>{

      const nl={id:uid(), name:l.name+"(匯入)", color:l.color};

      map[l.id]=nl.id; data.lists.push(nl);

    });

    let ord=data.tasks.reduce((a,t)=>Math.max(a,t.order),-1);

    inc.tasks.forEach(t=>{

      const nt=clone(t); nt.id=uid(); nt.listId=map[t.listId]||data.lists[0].id;

      nt.order=++ord; data.tasks.push(nt);

    });

  } else {

    inc.lists.forEach(l=>{

      const ex=data.lists.find(x=>x.id===l.id);

      if(ex){ ex.name=l.name; ex.color=l.color; } else data.lists.push(clone(l));

    });

    let ord=data.tasks.reduce((a,t)=>Math.max(a,t.order),-1);

   inc.tasks.forEach(t=>{

      const ex=data.tasks.find(x=>x.id===t.id);

      if(ex){ if((t.updatedAt||"")>(ex.updatedAt||"")) Object.assign(ex, clone(t)); }

      else { const nt=clone(t); nt.order=++ord; data.tasks.push(nt); }

    });

  }

  data=migrate(data); save(); render();

  toast("匯入完成，共 "+inc.tasks.length+" 個項目");

}
