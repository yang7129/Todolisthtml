/* =========================================================================

   AutoBackup — 自動備份到你選的本機資料夾

   清除瀏覽資料 / 換瀏覽器 / 無痕模式都不會弄丟這份備份。

 

   實測結論（2026-09-06，Edge 109 + Chrome 151，Playwright）：

     file:// 是 secure context，showDirectoryPicker / showSaveFilePicker 皆可用。

   執行期三分支，自己判斷不用問人：

     A. handle 讀得回且 queryPermission = granted → 靜默覆寫，資料夾固定 2 個檔

     B. handle 讀得回但 = prompt                  → 顯示一顆按鈕，點一次續用

     C. 沒 handle / API 不支援 / 使用者選下載模式 → 下載模式，一天最多一個檔

 

   對外只有四個入口：

     AutoBackup.init(cfg)   啟動

     AutoBackup.markDirty() 資料有變動時呼叫（很便宜，可以每次存檔都叫）

     AutoBackup.now()       立即備份

     AutoBackup.settings()  開設定對話框

 

   cfg: { ns, appName, collect, intervalMs, toast,

          summary(d)  → 給人看的一行摘要，例如 "12 個項目"

          isEmpty(d)  → 這份資料算不算空的（空的一律不備份，見下）

          restore(d)  → 用這份資料覆蓋目前資料 }

 

   兩道防呆，理由是同一個情境：清除瀏覽資料後工具是空的、授權也沒了，

   使用者重新指定資料夾時，絕不能拿空資料蓋掉他僅剩的那份備份。

     1. 空資料一律不寫（isEmpty）。

     2. 選到的資料夾裡已經有備份 → 先停下來問，不自動寫。

   ========================================================================= */

const AutoBackup = (function () {

  "use strict";

 

  let cfg = null;                 // { ns, appName, collect, intervalMs, toast }

  let dirHandle = null;           // FileSystemDirectoryHandle

  let mode = 'unset';             // unset | dir | download | off

  let meta = {};                  // 存 localStorage，被清掉也只是多備份一次

  let dirty = false;

  let busy = false;

  let barEl = null;

  let paused = false;             // 等使用者決定「還原還是覆蓋」時，暫停一切自動寫入

 

  const HAS_FSA = typeof window.showDirectoryPicker === 'function';

  const DAY = 86400000;

 

  /* ---------- meta（localStorage；清掉不影響正確性） ---------- */

  const mkey = () => cfg.ns + '.backup.meta';

  function loadMeta() {

    try { meta = JSON.parse(localStorage.getItem(mkey()) || '{}'); }

    catch (e) { meta = {}; }

    if (!meta || typeof meta !== 'object') meta = {};

  }

  function saveMeta() {

    try { localStorage.setItem(mkey(), JSON.stringify(meta)); } catch (e) {}

  }

 

  /* ---------- 「還沒備份」旗標 ----------

     關窗時寫檔是 async，瀏覽器不保證跑得完；但 localStorage 是同步的，一定寫得進去。

     所以關窗只負責記旗標，真正補備份留到下次開啟 —— 那時候要多久有多久。

     旗標只有備份成功才會清掉，所以「寫到一半被關掉」也不會漏。 */

  const pkey = () => cfg.ns + '.backup.pending';

  function setPending() {

    if (mode !== 'dir' && mode !== 'download') return;  // 沒設定／已關閉就別留旗標，不然會卡住

    try { localStorage.setItem(pkey(), '1'); } catch (e) {}

  }

  function clearPending() { try { localStorage.removeItem(pkey()); } catch (e) {} }

  function isPending()    { try { return localStorage.getItem(pkey()) === '1'; } catch (e) { return false; } }

 

  /* ---------- handle 只能存 IndexedDB（結構化複製，localStorage 放不下） ---------- */

  function hdb() {

    return new Promise((res, rej) => {

      let r;

      try { r = indexedDB.open(cfg.ns + '.backup', 1); }

      catch (e) { return rej(e); }

      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };

      r.onsuccess = () => res(r.result);

      r.onerror = () => rej(r.error);

    });

  }

  async function hput(k, v) {

    const db = await hdb();

    return new Promise((res, rej) => {

      const t = db.transaction('kv', 'readwrite');

      t.objectStore('kv').put(v, k);

      t.oncomplete = res; t.onerror = () => rej(t.error);

    });

  }

  async function hget(k) {

    const db = await hdb();

    return new Promise((res, rej) => {

      const t = db.transaction('kv', 'readonly');

      const q = t.objectStore('kv').get(k);

      q.onsuccess = () => res(q.result);

      q.onerror = () => rej(q.error);

    });

  }

 

  /* ---------- 小工具 ---------- */

  function hash(s) {                       // FNV-1a，只用來判斷「資料有沒有真的變」

    let h = 0x811c9dc5;

    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }

    return h.toString(16);

  }

  function today() {

    const d = new Date(), p = n => String(n).padStart(2, '0');

    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());

  }

  const fileName = () => cfg.appName + '-backup.json';

  const prevName = () => cfg.appName + '-backup-prev.json';

  const dayName  = () => cfg.appName + '-backup-' + today() + '.json';

 

  // 備份檔就是工具自己的匯出格式，多掛一個 _backup 註記而已 —

  // 這樣它可以被「匯入 JSON」直接吃下去，不需要任何轉檔。

  function stamp(d) {

    const s = { _backup: { app: cfg.appName, at: new Date().toISOString(), by: 'AutoBackup' } };

    const out = (d && typeof d === 'object' && !Array.isArray(d))

      ? Object.assign({}, d, s)

      : Object.assign({ data: d }, s);

    return JSON.stringify(out);

  }

 

  // 讀回備份資料夾裡現有的那份（沒有就回 null）。

  // 資料夾 handle 是讀寫的，所以「指定完資料夾後讀回自己存的 JSON」完全做得到。

  async function readBackup(dir, which) {

    try {

      const fh = await dir.getFileHandle(which || fileName());

      const txt = await (await fh.getFile()).text();

      return txt ? JSON.parse(txt) : null;

    } catch (e) { return null; }

  }

 

  /* ---------- 寫入：資料夾模式（固定兩個檔，永遠不會長大） ---------- */

  async function writeDir(text) {

    // 先把現有的那份挪成 -prev，再覆寫最新的那份

    try {

      const cur = await dirHandle.getFileHandle(fileName());

      const old = await (await cur.getFile()).text();

      if (old) {

        const ph = await dirHandle.getFileHandle(prevName(), { create: true });

        const pw = await ph.createWritable();

        await pw.write(old); await pw.close();

      }

    } catch (e) { /* 第一次備份沒有舊檔，正常 */ }

    const fh = await dirHandle.getFileHandle(fileName(), { create: true });

    const w = await fh.createWritable();

    await w.write(text); await w.close();

  }

 

  /* ---------- 寫入：下載模式（一天一個檔） ---------- */

  function writeDownload(text) {

    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });

    const a = document.createElement('a');

    a.href = URL.createObjectURL(blob);

    a.download = dayName();

    document.body.appendChild(a); a.click();

    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

  }

 

  /* ---------- 核心：該不該備份、怎麼備份 ---------- */

  async function run(reason) {

    if (busy || paused || mode === 'off' || mode === 'unset') return false;

    busy = true;

    try {

      const d = await cfg.collect();

 

      // 防呆一：空資料一律不備份。

      // 清除瀏覽資料後工具是空的，這時候寫下去就等於把僅存的備份洗掉。

      if (cfg.isEmpty && cfg.isEmpty(d)) {

        if (reason === 'manual') note('目前沒有資料，不需要備份');

        dirty = false;

        clearPending();

        return false;

      }

 

      const text = stamp(d);

      const h = hash(text);

      // 資料沒真的變就不寫，省得覆蓋掉好的備份、也省下載檔

      if (reason !== 'manual' && h === meta.lastHash) { dirty = false; clearPending(); return false; }

 

      if (mode === 'dir') {

        if (!dirHandle) { showBar('lost'); return false; }

        const perm = await dirHandle.queryPermission({ mode: 'readwrite' });

        if (perm !== 'granted') { showBar('prompt'); return false; }

        await writeDir(text);

      } else {

        // 下載模式：一天一個檔，同一天內只寫第一次

        if (reason !== 'manual' && meta.lastDay === today()) { dirty = false; clearPending(); return false; }

        writeDownload(text);

        meta.lastDay = today();

      }

      meta.lastHash = h;

      meta.lastAt = Date.now();

      meta.size = text.length;

      saveMeta();

      dirty = false;

      clearPending();

      hideBar();

      return true;

    } catch (e) {

      console.warn('[AutoBackup] 失敗:', e);

      if (mode === 'dir' && (e.name === 'NotAllowedError' || e.name === 'NotFoundError')) showBar('lost');

      return false;

    } finally { busy = false; }

  }

 

  function due() {

    if (!meta.lastAt) return true;

    return Date.now() - meta.lastAt >= (cfg.intervalMs || DAY);

  }

 

  /* ---------- 提示列（自帶樣式，不依賴各工具的 CSS） ---------- */

  function killBar() { if (barEl) { barEl.remove(); barEl = null; } }

  function hideBar() { killBar(); }

  function mkBtn(label, primary, fn) {

    const b = document.createElement('button');

    b.textContent = label;

    b.style.cssText = 'font:inherit;padding:5px 12px;margin-left:8px;border-radius:6px;cursor:pointer;border:1px solid ' +

      (primary ? '#2563eb;background:#2563eb;color:#fff' : 'rgba(0,0,0,.25);background:#fff;color:#333');

    b.onclick = fn;

    return b;

  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

 

  function showBar(kind) {

    killBar();

    const bar = document.createElement('div');

    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#fef3c7;' +

      'border-top:1px solid #f59e0b;color:#7c2d12;padding:10px 14px;font:14px/1.5 system-ui,sans-serif;' +

      'display:flex;align-items:center;flex-wrap:wrap;gap:4px;box-shadow:0 -2px 8px rgba(0,0,0,.08)';

    const msg = document.createElement('span');

    msg.style.cssText = 'flex:1;min-width:220px';

    bar.appendChild(msg);

 

    if (kind === 'setup') {

     msg.innerHTML = '<b>還沒設定自動備份。</b>資料目前只存在這個瀏覽器裡，' +

        '清除瀏覽資料就會全部消失。選一個資料夾，之後它會自動把備份寫進去。';

      if (HAS_FSA) bar.appendChild(mkBtn('選擇備份資料夾', true, chooseDir));

      bar.appendChild(mkBtn(HAS_FSA ? '改用下載資料夾' : '啟用（存到下載資料夾）', !HAS_FSA, useDownload));

      bar.appendChild(mkBtn('先不要', false, () => { mode = 'off'; meta.mode = 'off'; saveMeta(); killBar(); }));

    } else if (kind === 'prompt') {

      msg.innerHTML = '<b>自動備份需要你確認一次。</b>瀏覽器重開後要重新授權存取備份資料夾' +

        (meta.dirName ? '（<b>' + esc(meta.dirName) + '</b>）' : '') + '。';

      bar.appendChild(mkBtn('允許並立即備份', true, regrant));

      bar.appendChild(mkBtn('稍後', false, killBar));

    } else if (kind === 'lost') {

      msg.innerHTML = '<b>備份資料夾連不上了</b>（資料夾被搬走、刪掉，或授權已被清除）。請重新選一個。';

      if (HAS_FSA) bar.appendChild(mkBtn('重新選擇', true, chooseDir));

      bar.appendChild(mkBtn('改用下載資料夾', false, useDownload));

      bar.appendChild(mkBtn('稍後', false, killBar));

    }

    document.body.appendChild(bar);

    barEl = bar;

  }

 

  /* ---------- 使用者動作（都必須在 click 裡，FSA 要 user activation） ---------- */

  async function chooseDir() {

    try {

      const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: cfg.ns + '-backup', startIn: 'downloads' });

      const perm = await dir.requestPermission({ mode: 'readwrite' });

      if (perm !== 'granted') { note('沒有取得寫入權限，自動備份未啟用'); return; }

 

      // 防呆二：這個資料夾裡已經有備份的話，先停下來問，不要自動蓋過去。

      const found = await readBackup(dir) || await readBackup(dir, prevName());

 

      dirHandle = dir;

      // 存不起來（例如無痕模式擋 IndexedDB）不該讓整件事失敗：

      // 這次開著的期間照樣能備份，只是下次開檔要重選。

      try { await hput('dir', dir); }

      catch (e) { console.warn('[AutoBackup] handle 存不起來，這次仍可備份:', e); }

      mode = 'dir'; meta.mode = 'dir'; meta.dirName = dir.name;

      meta.lastHash = null;                 // 換資料夾就重新寫一份

      saveMeta();

      killBar();

 

      if (found) { askRestore(found, dir.name); return; }

      const ok = await run('manual');

      note(ok ? '自動備份已啟用 → ' + dir.name + ' \\ ' + fileName()

              : '自動備份已啟用 → ' + dir.name + '（目前沒有資料，等有東西再寫）');

    } catch (e) {

      if (e.name !== 'AbortError') note('選擇資料夾失敗：' + e.message);

    }

  }

 

  /* ---------- 這個資料夾已經有備份了：要還原、還是覆蓋？ ---------- */

  async function askRestore(found, dirName) {

    paused = true;                                   // 使用者決定前，一律不寫

    const cur = await cfg.collect();

    const curEmpty = cfg.isEmpty ? cfg.isEmpty(cur) : false;

    const sum = d => (cfg.summary ? cfg.summary(d) : '（無法判讀內容）');

    const at = found._backup && found._backup.at ? new Date(found._backup.at).toLocaleString()

             : (found.exportedAt ? new Date(found.exportedAt).toLocaleString() : '時間不明');

 

    const wrap = document.createElement('div');

    wrap.style.cssText = 'position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.5);display:flex;' +

      'align-items:center;justify-content:center;padding:16px';

    const box = document.createElement('div');

    box.style.cssText = 'background:#fff;color:#222;border-radius:10px;max-width:560px;width:100%;' +

      'padding:20px;font:14px/1.7 system-ui,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.3)';

    box.innerHTML =

      '<h3 style="margin:0 0 12px">這個資料夾裡已經有一份備份</h3>' +

      '<table style="width:100%;border-collapse:collapse;margin-bottom:12px">' +

      '<tr><td style="padding:6px 0;color:#666;width:110px">資料夾</td><td><b>' + esc(dirName) + '</b></td></tr>' +

      '<tr><td style="padding:6px 0;color:#666">備份檔內容</td><td><b>' + esc(sum(found)) + '</b>　<span style="color:#666">' + esc(at) + '</span></td></tr>' +

      '<tr><td style="padding:6px 0;color:#666">目前畫面上</td><td><b>' + esc(sum(cur)) + '</b>' +

        (curEmpty ? '　<span style="color:#b45309">（是空的）</span>' : '') + '</td></tr></table>' +

      (curEmpty

        ? '<p style="margin:0;padding:10px 12px;background:#ecfdf5;border-left:3px solid #10b981;border-radius:4px">' +

          '目前沒有資料，備份檔裡有。看起來是<b>清除瀏覽資料之後重新設定</b>，建議<b>還原</b>把東西拿回來。</p>'

        : '<p style="margin:0;padding:10px 12px;background:#fef3c7;border-left:3px solid #f59e0b;border-radius:4px">' +

          '兩邊都有資料。<b>還原</b>會用備份檔覆蓋掉目前畫面上的東西；' +

          '<b>保留目前的</b>則會把備份檔換成現在這份（舊的還會留在 -prev）。</p>') +

      '<div id="_abRB" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end"></div>';

    const btns = box.querySelector('#_abRB');

    const close = () => { wrap.remove(); paused = false; };

 

    btns.appendChild(mkBtn('還原（用備份覆蓋目前資料）', curEmpty, async () => {

      wrap.remove();

      try {

        await cfg.restore(found);

        paused = false;

        meta.lastHash = null; saveMeta();

        note('已還原：' + sum(found));

      } catch (e) { paused = false; note('還原失敗：' + e.message); }

    }));

    btns.appendChild(mkBtn('保留目前的（覆蓋備份）', !curEmpty, async () => {

      wrap.remove(); paused = false;

      const ok = await run('manual');

      note(ok ? '已用目前資料覆蓋備份' : '沒有寫入（目前沒有資料）');

    }));

    btns.appendChild(mkBtn('先不要動', false, close));

    wrap.appendChild(box);

    document.body.appendChild(wrap);

  }

 

  /* ---------- 主動從備份資料夾讀回來（設定裡的「從備份還原」） ---------- */

  async function restoreFromDir() {

    if (mode !== 'dir' || !dirHandle) { note('尚未設定備份資料夾'); return; }

    try {

      const perm = await dirHandle.requestPermission({ mode: 'readwrite' });

      if (perm !== 'granted') { note('未取得資料夾權限'); return; }

      const found = await readBackup(dirHandle) || await readBackup(dirHandle, prevName());

      if (!found) { note('備份資料夾裡找不到 ' + fileName()); return; }

      askRestore(found, meta.dirName || '備份資料夾');

    } catch (e) { note('讀取備份失敗：' + e.message); }

  }

  async function regrant() {

    try {

      const perm = await dirHandle.requestPermission({ mode: 'readwrite' });

      if (perm !== 'granted') { note('未取得權限'); return; }

      killBar();

      const ok = await run('manual');

      note(ok ? '已備份' : '權限拿到了，但寫入失敗');

    } catch (e) { note('授權失敗：' + e.message); }

  }

  function useDownload() {

    mode = 'download'; meta.mode = 'download'; meta.lastDay = null; meta.lastHash = null;

    saveMeta(); killBar();

    run('manual').then(ok => note(ok ? '已備份到下載資料夾（每天最多一個檔）' : '備份失敗'));

  }

  function note(m) {

    if (cfg.toast) { try { cfg.toast(m); return; } catch (e) {} }

    console.log('[AutoBackup]', m);

  }

 

  /* ---------- 設定對話框 ---------- */

  function settings() {

    const wrap = document.createElement('div');

    wrap.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.45);display:flex;' +

      'align-items:center;justify-content:center;padding:16px';

    const box = document.createElement('div');

    box.style.cssText = 'background:#fff;color:#222;border-radius:10px;max-width:520px;width:100%;' +

      'padding:20px;font:14px/1.7 system-ui,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.3)';

    const st = mode === 'dir'

        ? '資料夾模式 — <b>' + esc(meta.dirName || '?') + '</b>，固定只有 2 個檔（最新 + 前一份），不會越積越多'

      : mode === 'download' ? '下載模式 — 每天最多一個檔 <b>' + esc(dayName()) + '</b>，需自行定期清理'

      : mode === 'off' ? '<b>已關閉</b> — 資料只存在瀏覽器，清除瀏覽資料就沒了'

      : '尚未設定';

    box.innerHTML =

      '<h3 style="margin:0 0 12px">自動備份</h3>' +

      '<p style="margin:0 0 10px">目前狀態：' + st + '</p>' +

      '<p style="margin:0 0 10px;color:#555">上次備份：' +

        (meta.lastAt ? new Date(meta.lastAt).toLocaleString() + '（' + Math.round((meta.size || 0) / 1024) + ' KB）' : '從未') +

      '<br>備份時機：<b>切到背景（最小化／鎖螢幕／關窗）且資料有變動 → 一定備份</b>；' +

      '沒寫完的話下次開啟會補。編輯過程中則是每 ' +

      Math.round((cfg.intervalMs || DAY) / 3600000) + ' 小時最多一次，免得每打一個字就寫檔。' +

      '<br>想現在就備一份：按 <b>Ctrl+S</b>，或下面的「立即備份」。' +

      '<br>資料是空的時候不會備份，不會把好的備份洗掉。</p>' +

      '<div id="_abBtns" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end"></div>';

    const btns = box.querySelector('#_abBtns');

    const close = () => wrap.remove();

    if (HAS_FSA) btns.appendChild(mkBtn(mode === 'dir' ? '換一個資料夾…' : '選擇備份資料夾', mode !== 'dir', () => { close(); chooseDir(); }));

    if (mode === 'dir') btns.appendChild(mkBtn('從備份還原…', false, () => { close(); restoreFromDir(); }));

    btns.appendChild(mkBtn('改用下載資料夾', false, () => { close(); useDownload(); }));

    btns.appendChild(mkBtn('立即備份', mode === 'dir', () => { run('manual').then(ok => note(ok ? '已備份' : '備份失敗或尚未設定')); close(); }));

    if (mode !== 'off') btns.appendChild(mkBtn('關閉自動備份', false, () => { mode = 'off'; meta.mode = 'off'; saveMeta(); clearPending(); close(); note('已關閉自動備份'); }));

    btns.appendChild(mkBtn('完成', false, close));

    wrap.appendChild(box);

    wrap.onclick = e => { if (e.target === wrap) close(); };

    document.body.appendChild(wrap);

  }

 

  /* ---------- 啟動 ---------- */

  async function init(c) {

    cfg = c;

    loadMeta();

    mode = meta.mode || 'unset';

 

    if (mode === 'dir') {

      try {

        dirHandle = await hget('dir');

        if (!dirHandle) { mode = 'unset'; }          // handle 被清掉了（通常就是清除網站資料）

        else {

          const perm = await dirHandle.queryPermission({ mode: 'readwrite' });

          if (perm !== 'granted') showBar('prompt'); // 分支 B：等使用者點一次

        }

      } catch (e) { mode = 'unset'; }

    }

    if (mode === 'unset') setTimeout(() => { if (mode === 'unset') showBar('setup'); }, 1200);

 

    // 切到背景（最小化／鎖螢幕／切分頁／關窗）時：

    // 先同步記旗標（一定成功），再試著當場寫檔（非同步，可能來不及）。

    // 寫成功才清旗標，所以來不及也不會漏 —— 下次開啟補。

    //

    // 這裡刻意不看 due()：run() 裡本來就有雜湊比對，資料沒真的變就不會寫，

    // due() 在這條路徑上是多餘的第二層節流，只會造成「我明明縮小了怎麼沒備份」。

    // 資料夾模式固定 2 個檔，多寫幾次也不會長大。

    document.addEventListener('visibilitychange', () => {

      if (document.visibilityState !== 'hidden' || !dirty) return;

      setPending();

      run('hidden');

    });

    // 直接關視窗時 visibilitychange 不一定跑得到，這兩個再保險一次（都是同步的）

    const markPending = () => { if (dirty) setPending(); };

    window.addEventListener('pagehide', markPending);

    window.addEventListener('beforeunload', markPending);

 

    // 開檔後先看一次該不該備份；上次關窗沒補到的，這裡無視 24 小時節流直接補

    setTimeout(() => {

      if (isPending()) run('pending');

      else if (due()) run('startup');

    }, 3000);

  }

 

  // 資料變動：很便宜，可以在每次存檔都呼叫。真正寫入由 due() 節流。

  function markDirty() {

    dirty = true;

    if (mode === 'unset' || mode === 'off') return;

    if (due()) run('dirty');       // 多半在 click 事件裡被觸發 → 下載模式也有 user activation

  }

 

  return {

    init, markDirty, settings, restoreFromDir,

    now: () => run('manual'),

    get mode() { return mode; }

  };

})();

 

/* =====================================================================

   啟動

   ===================================================================== */

data=load();

autoPurge();

snapshot();

render();

 

/* 版面偏好：要在 render() 之後套用，元素才存在 */

(function(){

  const u = readUI();

  ui.sideHide = !!u.sideHide;

  ui.dw = dnumUI(u.dw) || DW_DEF;

  applySideHide();

  applyDetailWidth(ui.dw);

  initDetailResize();

})();

checkShareHash();

$("#addinput").focus();

 

AutoBackup.init({

  ns: "todolisthtml",

  appName: "Todolisthtml",

  intervalMs: 86400000,                       // 每天最多備份一次

  toast: m => toast(m),

  collect: () => exportData(data.tasks.slice(), true),  // 與「匯出 JSON」同格式，可直接匯入

  summary: d => (d.tasks||[]).length + " 個項目、" + (d.lists||[]).length + " 個清單",

  isEmpty: d => !(d.tasks||[]).length && !(d.trash||[]).length,

  restore: d => {                             // 用備份覆蓋目前資料（Ctrl+Z 可復原）

    push();

    const b = blank();

    b.settings  = d.settings  ? clone(d.settings)  : b.settings;

    b.lists     = (d.lists    || []).map(clone);

    b.tasks     = (d.tasks    || []).map(clone);

    b.trash     = (d.trash    || []).map(clone);

    b.templates = (d.templates|| []).map(clone);

    if(!b.lists.length) b.lists = blank().lists;

    data = migrate(b);

    save(); render();

  }

});

window.addEventListener("beforeunload", ()=>{ if(saveTimer){ clearTimeout(saveTimer);

  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} } });

</script>
